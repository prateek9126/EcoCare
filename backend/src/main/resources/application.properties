# =========================================================
# APPLICATION
# =========================================================
spring.application.name=ev-battery-health

# =========================================================
# SERVER (8080 locally, or $PORT on Render/Cloud)
# =========================================================
server.port=${PORT:8080}

# =========================================================
# POSTGRESQL DATABASE - RENDER & LOCAL FALLBACK
# =========================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EVCharging}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Prateek@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# EUREKA - DISABLED FOR RENDER
# =========================================================
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false